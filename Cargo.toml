[package]
name = "profanity-verifier"
version = "0.1.0"
edition = "2021"
description = "Provable check for CVE-2022-40769: does an EOA's private key lie in the Profanity-reachable key space?"
license = "MIT"

[[bin]]
name = "profanity-verifier"
path = "src/main.rs"

[dependencies]
secp256k1 = { version = "0.29", features = ["recovery"] }
sha3 = "0.10"
hex = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
